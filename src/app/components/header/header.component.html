<header class="header" [class.scrolled]="scrolled" [class.menu-open]="isMenuOpen">
  <div class="bar-inner">

    <!-- Logo -> inicio -->
    <a class="logo"
       [routerLink]="['/', currentLang]"
       (click)="closeMenu()"
       aria-label="Alquimia Dental – Home">
      <img src="logo.png" width="80" height="80" alt="" aria-hidden="true" class="logo-img" decoding="async" />
    </a>

    <!-- Navegación principal -->
    <nav id="main-nav" class="nav" [class.nav-open]="isMenuOpen" aria-label="Main">
      <ul class="nav-list">
        <li *ngFor="let l of links; let i = index">
          <a class="nav-link"
             [routerLink]="linkFor(l.path)"
             routerLinkActive="active"
             [routerLinkActiveOptions]="{ exact: l.exact }"
             (click)="closeMenu()">
            <span class="idx" aria-hidden="true">{{ roman(i) }}</span>
            <span class="label">{{ l.key | translate }}</span>
          </a>
        </li>
      </ul>

      <!-- CTA dentro del menú móvil -->
      <a class="cta cta-mobile"
         [href]="whatsappHref"
         target="_blank" rel="noopener noreferrer"
         [attr.aria-label]="whatsappAriaLabel"
         (click)="closeMenu()">
        <i class="bi bi-whatsapp" aria-hidden="true"></i>
        {{ 'header.bookCta' | translate }}
      </a>
    </nav>

    <!-- Acciones -->
    <div class="actions">
      <a class="cta cta-desktop"
         [href]="whatsappHref"
         target="_blank" rel="noopener noreferrer"
         [attr.aria-label]="whatsappAriaLabel">
        <i class="bi bi-whatsapp" aria-hidden="true"></i>
        <span>{{ 'header.bookCta' | translate }}</span>
      </a>

      <div class="lang" role="group" aria-label="Language selector">
        <button type="button" class="lang-btn"
          [class.active]="currentLang === 'es'"
          [attr.aria-current]="currentLang === 'es' ? 'true' : null"
          (click)="switchLang('es')"
          [attr.aria-label]="currentLang === 'es' ? 'Idioma actual: Español' : 'Cambiar a Español'">ES</button>
        <span class="sep" aria-hidden="true">/</span>
        <button type="button" class="lang-btn"
          [class.active]="currentLang === 'en'"
          [attr.aria-current]="currentLang === 'en' ? 'true' : null"
          (click)="switchLang('en')"
          [attr.aria-label]="currentLang === 'en' ? 'Current language: English' : 'Switch to English'">EN</button>
      </div>

      <button class="menu-toggle"
        type="button"
        (click)="toggleMenu()"
        aria-label="Menu"
        [attr.aria-expanded]="isMenuOpen"
        aria-controls="main-nav">
        <span class="bar"></span><span class="bar"></span>
      </button>
    </div>
  </div>
</header>
