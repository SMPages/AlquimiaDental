<ng-container *ngIf="servicio">
  <app-page-hero
    [eyebrow]="'nav.services' | translate"
    [title]="servicio.title | translate"
    [subtitle]="servicio.desc | translate">
  </app-page-hero>

  <section class="sd-section">
    <div class="sd-inner sd-grid">

      <div class="sd-media" *ngIf="servicio.image">
        <img
          [src]="servicio.image"
          [alt]="servicio.alt | translate"
          loading="lazy"
          decoding="async" />
      </div>

      <div class="sd-content">
        <!-- Descripción extendida (HTML real del JSON) -->
        <div class="sd-extra" [innerHTML]="servicio.detailedDesc"></div>
      </div>
    </div>
  </section>

  <!-- Otros tratamientos -->
  <section class="sd-others">
    <div class="sd-inner">
      <h2>{{ 'servicesPage.others' | translate }}</h2>
      <div class="sd-others-grid">
        <a *ngFor="let o of others" class="sd-other" [routerLink]="['/', currentLang, 'servicio', o]">
          <div class="sd-other-media">
            <img [src]="serviceImages[o]" [alt]="('services_hero.items.' + o + '.alt') | translate" loading="lazy" decoding="async" />
          </div>
          <h3>{{ ('services_hero.items.' + o + '.title') | translate }}</h3>
          <span class="sd-other-link">{{ 'servicesPage.view' | translate }} <i class="bi bi-arrow-right" aria-hidden="true"></i></span>
        </a>
      </div>
    </div>
  </section>

  <section class="sd-cta">
    <div class="sd-inner">
      <h2>{{ 'services.ctaText' | translate }}</h2>
      <a class="sd-btn"
         [href]="whatsappHref"
         target="_blank" rel="noopener"
         [attr.aria-label]="'alquimia.cta.book_aria' | translate">
        <i class="bi bi-whatsapp" aria-hidden="true"></i>
        {{ 'services.ctaButton' | translate }}
      </a>
    </div>
  </section>
</ng-container>
