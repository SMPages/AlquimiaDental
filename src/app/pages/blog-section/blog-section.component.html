<app-page-hero
  [eyebrow]="'blogPage.press' | translate"
  [title]="'media.title' | translate"
  [subtitle]="'media.subtitle' | translate">
</app-page-hero>

<!-- ===== Artículo destacado ===== -->
<section id="media" class="feature" aria-labelledby="featured-title">
  <article class="inner feature-grid" itemscope itemtype="https://schema.org/NewsArticle">

    <div class="cover">
      <a href="https://es.rollingstone.com/el-arte-de-reinventar-sonrisas/"
         target="_blank" rel="noopener"
         class="image-link"
         [attr.aria-label]="'media.featured.linkAria' | translate">
        <img
          src="https://i0.wp.com/es.rollingstone.com/wp-content/uploads/2022/05/El-arte-de-reinventar-sonrisas-portada.jpg?w=1280&ssl=1"
          width="1280" height="720"
          [alt]="'media.featured.imageAlt' | translate"
          loading="lazy" decoding="async" itemprop="image" />
      </a>

      <!-- Logo en su color original sobre una pastilla marfil -->
      <span class="badge">
        <img
          src="https://i0.wp.com/es.rollingstone.com/wp-content/uploads/2022/08/LOGO-RSEE-DIGITAL-NEW.png?w=1366&ssl=1"
          alt="Rolling Stone" width="96" height="28"
          loading="lazy" decoding="async" />
      </span>
    </div>

    <div class="story">
      <span class="eyebrow">{{ 'media.featured.source' | translate }}</span>

      <h2 id="featured-title" itemprop="headline">
        {{ 'media.featured.headline' | translate }}
      </h2>

      <p class="excerpt" itemprop="description">
        {{ 'media.featured.excerpt' | translate }}
      </p>

      <a class="read"
         href="https://es.rollingstone.com/el-arte-de-reinventar-sonrisas/"
         target="_blank" rel="noopener"
         itemprop="mainEntityOfPage">
        {{ 'media.featured.readMore' | translate }}
        <i class="bi bi-arrow-up-right" aria-hidden="true"></i>
      </a>
    </div>
  </article>
</section>

<!-- ===== Cierre ===== -->
<section class="cta">
  <div class="inner">
    <h2>{{ 'blogPage.igTitle' | translate }}</h2>
    <a class="btn-gold"
       href="https://www.instagram.com/drsoranyporcelainsmile/"
       target="_blank" rel="noopener">
      <i class="bi bi-instagram" aria-hidden="true"></i>
      {{ 'blogPage.igBtn' | translate }}
    </a>
  </div>
</section>
