<app-page-hero
  [eyebrow]="'nav.services' | translate"
  [title]="'services.title' | translate"
  [subtitle]="'services.subtitle' | translate">
</app-page-hero>

<section id="services" class="services" [attr.aria-label]="'services.title' | translate">
  <div class="inner">
    <article class="svc" *ngFor="let s of items; let i = index" [class.flip]="i % 2 === 1">
      <div class="media">
        <img
          [src]="s.icon"
          [alt]="'services.items.' + s.key + '.alt' | translate"
          loading="lazy"
          decoding="async" />
      </div>

      <div class="body">
        <span class="num" aria-hidden="true">{{ roman(i) }}</span>
        <h2>{{ ('services.items.' + s.key + '.title') | translate }}</h2>
        <p [innerHTML]="('services.items.' + s.key + '.desc') | translate"></p>
      </div>
    </article>
  </div>
</section>

<section class="cta">
  <div class="inner">
    <h2>{{ 'services.ctaText' | translate }}</h2>
    <a class="btn-gold"
       [href]="whatsappHref"
       target="_blank" rel="noopener"
       [attr.aria-label]="'alquimia.cta.book_aria' | translate">
      <i class="bi bi-whatsapp" aria-hidden="true"></i>
      {{ 'services.ctaButton' | translate }}
    </a>
  </div>
</section>
