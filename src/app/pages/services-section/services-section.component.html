<app-page-hero
  [eyebrow]="'nav.services' | translate"
  [title]="'services.title' | translate"
  [subtitle]="'services.subtitle' | translate">
</app-page-hero>

<section id="services" class="services" [attr.aria-label]="'services.title' | translate">
  <div class="inner">

    <!-- Filtros -->
    <div class="filters" role="group" [attr.aria-label]="'servicesPage.filterLabel' | translate">
      <button *ngFor="let f of filters"
        type="button"
        class="chip"
        [class.active]="filter === f"
        [attr.aria-pressed]="filter === f"
        (click)="setFilter(f)">
        {{ 'servicesPage.' + f | translate }}
      </button>
    </div>

    <!-- Tarjetas -->
    <div class="grid">
      <article class="svc" *ngFor="let s of visible; trackBy: trackByKey" [class.open]="expanded.has(s.key)">
        <div class="media">
          <img
            [src]="s.icon"
            [alt]="'services.items.' + s.key + '.alt' | translate"
            loading="lazy"
            decoding="async" />
        </div>

        <div class="body">
          <span class="num" aria-hidden="true">{{ roman(s.index) }}</span>
          <h2>{{ ('services.items.' + s.key + '.title') | translate }}</h2>

          <div class="desc" [id]="'desc-' + s.key" [innerHTML]="('services.items.' + s.key + '.desc') | translate"></div>

          <button type="button" class="more"
            (click)="toggle(s.key)"
            [attr.aria-expanded]="expanded.has(s.key)"
            [attr.aria-controls]="'desc-' + s.key">
            {{ (expanded.has(s.key) ? 'servicesPage.less' : 'servicesPage.more') | translate }}
            <i class="bi" [class.bi-plus-lg]="!expanded.has(s.key)" [class.bi-dash-lg]="expanded.has(s.key)" aria-hidden="true"></i>
          </button>

          <a *ngIf="s.detail" class="view" [routerLink]="['/', currentLang, 'servicio', s.detail]">
            {{ 'servicesPage.view' | translate }} <i class="bi bi-arrow-right" aria-hidden="true"></i>
          </a>
        </div>
      </article>
    </div>
  </div>
</section>

<section class="cta">
  <div class="inner">
    <h2>{{ 'services.ctaText' | translate }}</h2>
    <a class="btn-gold"
       [href]="whatsappHref"
       target="_blank" rel="noopener"
       [attr.aria-label]="'alquimia.cta.book_aria' | translate">
      <i class="bi bi-whatsapp" aria-hidden="true"></i>
      {{ 'services.ctaButton' | translate }}
    </a>
  </div>
</section>
