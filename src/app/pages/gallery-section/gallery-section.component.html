<app-page-hero
  [eyebrow]="'nav.gallery' | translate"
  [title]="'gallery.title' | translate"
  [subtitle]="'gallery.subtitle' | translate">
</app-page-hero>

<section id="galeria" class="gallery" [attr.aria-label]="'gallery.title' | translate">
  <div class="inner">

    <!-- Filtros -->
    <div class="filters" role="group" [attr.aria-label]="'servicesPage.filterLabel' | translate">
      <button *ngFor="let f of filters"
        type="button"
        class="chip"
        [class.active]="filter === f"
        [attr.aria-pressed]="filter === f"
        (click)="setFilter(f)">
        {{ 'servicesPage.' + f | translate }}
      </button>
    </div>

    <!-- Mosaico -->
    <div class="masonry">
      <button *ngFor="let it of visible; let i = index; trackBy: trackBySrc"
        type="button"
        class="tile"
        (click)="open(i)"
        [attr.aria-label]="('galleryPage.open' | translate) + ' ' + (it.title | translate)">
        <img [src]="it.src" [alt]="it.alt | translate" loading="lazy" decoding="async" />
        <span class="cap">{{ it.title | translate }}</span>
      </button>
    </div>
  </div>
</section>

<!-- Visor -->
<div class="viewer" *ngIf="current as c"
     role="dialog" aria-modal="true"
     [attr.aria-label]="'galleryPage.viewer' | translate"
     (click)="close()">

  <button type="button" class="v-btn close" (click)="close(); $event.stopPropagation()" [attr.aria-label]="'galleryPage.close' | translate">
    <i class="bi bi-x-lg" aria-hidden="true"></i>
  </button>

  <button type="button" class="v-btn prev" (click)="step(-1); $event.stopPropagation()" [attr.aria-label]="'galleryPage.prev' | translate">
    <i class="bi bi-chevron-left" aria-hidden="true"></i>
  </button>

  <figure (click)="$event.stopPropagation()">
    <img [src]="c.src" [alt]="c.alt | translate" />
    <figcaption>
      <strong>{{ c.title | translate }}</strong>
      <span *ngIf="c.desc">{{ c.desc | translate }}</span>
      <small>{{ openIndex! + 1 }} {{ 'galleryPage.count' | translate }} {{ visible.length }}</small>
    </figcaption>
  </figure>

  <button type="button" class="v-btn next" (click)="step(1); $event.stopPropagation()" [attr.aria-label]="'galleryPage.next' | translate">
    <i class="bi bi-chevron-right" aria-hidden="true"></i>
  </button>
</div>

<!-- Cierre -->
<section class="cta">
  <div class="inner">
    <h2>{{ 'story.cases.title' | translate }}</h2>
    <a class="btn-gold" [href]="instagram" target="_blank" rel="noopener"
       [attr.aria-label]="'gallery.moreCta' | translate">
      <i class="bi bi-instagram" aria-hidden="true"></i>
      {{ 'gallery.moreCta' | translate }}
    </a>
  </div>
</section>
