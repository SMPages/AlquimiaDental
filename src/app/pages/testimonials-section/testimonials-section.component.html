<app-page-hero
  [eyebrow]="'nav.opinions' | translate"
  [title]="'testimonials.title' | translate"
  [subtitle]="'testimonials.subtitle' | translate">
</app-page-hero>

<!-- ===== Opinión destacada ===== -->
<section id="testimonials" class="featured" [attr.aria-label]="'testimonials.title' | translate">
  <figure class="inner" itemprop="review" itemscope itemtype="https://schema.org/Review">
    <i class="bi bi-quote mark" aria-hidden="true"></i>
    <blockquote itemprop="reviewBody">
      {{ ('testimonials.items.' + featured + '.text') | translate }}
    </blockquote>
    <figcaption>
      <span class="avatar" aria-hidden="true">{{ ('testimonials.items.' + featured + '.author' | translate).charAt(0) }}</span>
      <strong itemprop="author">{{ ('testimonials.items.' + featured + '.author') | translate }}</strong>
    </figcaption>
  </figure>
</section>

<!-- ===== Mosaico de opiniones ===== -->
<section class="wall">
  <div class="inner masonry">
    <figure class="quote"
      *ngFor="let k of others; trackBy: trackByKey"
      itemprop="review" itemscope itemtype="https://schema.org/Review">
      <i class="bi bi-quote mark" aria-hidden="true"></i>
      <blockquote itemprop="reviewBody">
        {{ ('testimonials.items.' + k + '.text') | translate }}
      </blockquote>
      <figcaption>
        <span class="avatar" aria-hidden="true">{{ ('testimonials.items.' + k + '.author' | translate).charAt(0) }}</span>
        <strong itemprop="author">{{ ('testimonials.items.' + k + '.author') | translate }}</strong>
      </figcaption>
    </figure>
  </div>
</section>

<!-- ===== Cierre ===== -->
<section class="cta">
  <div class="inner">
    <h2>{{ 'testimonials.moreText' | translate }}</h2>
    <a class="btn-gold"
       [href]="googleReviewsUrl"
       target="_blank" rel="noopener"
       [attr.aria-label]="'testimonials.moreAria' | translate">
      <i class="bi bi-google" aria-hidden="true"></i>
      {{ 'testimonials.moreButton' | translate }}
    </a>
  </div>
</section>
